name: Build MONO APK

on:
  push:
    branches:
      - arena/2d3419e0-nourotour
    paths:
      - mono-source/**
      - .github/workflows/build-mono-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mono-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify MONO v1.9.0
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PROJECT_DIR: mono-source/MONO-v1.9.0
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Install required Android SDK packages
        run: |
          test -n "${ANDROID_HOME:-}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0"

      - name: Build signed debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            '-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'

      - name: Verify APK identity and signature
        run: |
          mkdir -p mono-output
          apk="mono-output/MONO-v1.9.0-debug.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee mono-output/signature-verification.txt
          "$tools/aapt" dump badging "$apk" | tee mono-output/apk-metadata.txt
          grep -F "package: name='com.mono.app' versionCode='9' versionName='1.9.0'" mono-output/apk-metadata.txt
          grep -Fx "application-label:'MONO'" mono-output/apk-metadata.txt
          grep -Fx "sdkVersion:'26'" mono-output/apk-metadata.txt
          grep -Fx "targetSdkVersion:'35'" mono-output/apk-metadata.txt
          if grep -Fq "uses-permission: name='android.permission.INTERNET'" mono-output/apk-metadata.txt; then
            echo 'Unexpected INTERNET permission in offline application' >&2
            exit 1
          fi
          (cd mono-output && sha256sum MONO-v1.9.0-debug.apk > SHA256SUMS.txt)
          {
            echo '## MONO v1.9.0 APK'
            echo
            echo '- Package: `com.mono.app`'
            echo '- Version: `1.9.0` / versionCode `9`'
            echo '- Minimum Android: 8.0 (API 26)'
            echo '- Debug-signed APK for a fresh personal installation; not an unsigned release.'
            echo '- Signature, package identity, SDK versions, launcher name and absence of INTERNET permission verified.'
            echo '- Device runtime behavior has not been tested by this workflow.'
            echo
            echo '```text'
            cat mono-output/SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK and verification results
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: MONO-v1.9.0-APK
          path: mono-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish direct APK download
    needs: build
    if: github.ref == 'refs/heads/arena/2d3419e0-nourotour'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the verified build artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: MONO-v1.9.0-APK
          path: mono-output

      - name: Check the APK checksum
        working-directory: mono-output
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish a MONO-only prerelease with a raw APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="mono-v1.9.0-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/mono-release-notes.md" <<'NOTES'
          ## MONO v1.9.0 — personal Android APK

          Download **MONO-v1.9.0-debug.apk** from the assets below and open it on Android 8.0 or newer. No ZIP extraction or Android Studio is needed.

          - Package: `com.mono.app`; versionCode: `9`; versionName: `1.9.0`.
          - Signed debug build for a **fresh installation**, not an app-store release.
          - Signature, application identity, SDK versions, MONO launcher name and absence of INTERNET permission verified by the build workflow.
          - Application source matches the supplied v1.9.0 archive; no app functionality was changed for the build.
          - Not tested on a physical Android device. A future build may use another debug signing key; back up your data before any uninstall.

          This MONO-only prerelease does not deploy or change the Nourotour website. SHA-256 and verification results are included as separate assets.
          NOTES
          gh release create "$tag" \
            mono-output/MONO-v1.9.0-debug.apk \
            mono-output/SHA256SUMS.txt \
            mono-output/apk-metadata.txt \
            mono-output/signature-verification.txt \
            --target "$GITHUB_SHA" \
            --title "MONO v1.9.0 — personal APK" \
            --prerelease --latest=false \
            --notes-file "$RUNNER_TEMP/mono-release-notes.md"
          release_url="$(gh release view "$tag" --json url --jq .url)"
          {
            echo '## Direct MONO APK download'
            echo
            echo "[Download MONO-v1.9.0-debug.apk](https://github.com/$GH_REPO/releases/download/$tag/MONO-v1.9.0-debug.apk)"
            echo
            echo "Release: $release_url"
          } >> "$GITHUB_STEP_SUMMARY"
